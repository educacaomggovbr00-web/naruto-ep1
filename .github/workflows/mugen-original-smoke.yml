name: Naruto MUGEN original - Godot smoke test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  godot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout original MUGEN prototype
        uses: actions/checkout@v4

      - name: Install Godot 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            -o /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          install -m 755 /tmp/Godot_v4.4.1-stable_linux.x86_64 /usr/local/bin/godot
          godot --version

      - name: Import project resources
        run: timeout 180s godot --headless --path . --editor --import

      - name: Check original prologue, sprites and Naruto MUGEN
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s godot --headless --path . --quit-after 600 --script res://tests/prologue_smoke.gd | tee smoke.log
          grep -Fq "PASS: complete prologue progression" smoke.log

      - name: Verify low-memory Android graphics path
        shell: bash
        run: |
          set -euo pipefail
          NARUTO_LOW_MEMORY=1 timeout 90s godot --headless --path . --quit-after 600 --script res://tests/prologue_smoke.gd | tee mobile-smoke.log
          grep -Fq "PASS: complete prologue progression" mobile-smoke.log

      - name: Verify dialogue and simultaneous touch controls
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/interface_smoke.gd | tee interface-smoke.log
          grep -Fq "PASS: dialogue reveal" interface-smoke.log

      - name: Verify cinematic presentation and audio controls
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/cinematic_smoke.gd | tee cinematic-smoke.log
          grep -Fq "PASS: stable interface" cinematic-smoke.log

      - name: Verify movement, dodge and saved progress
        shell: bash
        run: |
          set -euo pipefail
          timeout 45s godot --headless --path . --script res://tests/gameplay_smoke.gd | tee gameplay-smoke.log
          grep -Fq "PASS: sliding" gameplay-smoke.log

      - name: Verify narrative continuation and legacy saves
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot --headless --audio-driver Dummy --path . --script res://tests/episode_smoke.gd 2>&1 | tee episode-smoke.log
          grep -Fq "PASS: narrative morning" episode-smoke.log
          ! grep -Eq "SCRIPT ERROR|Assertion failed" episode-smoke.log
          NARUTO_LOW_MEMORY=1 timeout 60s godot --headless --audio-driver Dummy --path . --script res://tests/episode_smoke.gd 2>&1 | tee episode-mobile.log
          grep -Fq "PASS: narrative morning" episode-mobile.log
          ! grep -Eq "SCRIPT ERROR|Assertion failed" episode-mobile.log
